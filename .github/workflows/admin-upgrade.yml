name: Apply admin moderation upgrade
on:
  push:
    paths:
      - admin-upgrade.trigger
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          css='''\n.admin-only{display:none}.admin-grid{display:grid;grid-template-columns:220px 1fr;gap:12px}.admin-tabs{display:grid;gap:6px}.admin-tabs button{background:#111820;color:#aeb7bd;border:1px solid #27333d;border-radius:7px;padding:10px;text-align:left;font-size:10px}.admin-tabs button.active{background:#f3f4f5;color:#080a0c}.admin-list{display:grid;gap:8px}.admin-item{border:1px solid #202b34;border-radius:8px;padding:11px;background:#080d12}.admin-item b{font-size:11px}.admin-item small{display:block;color:#75818a;font-size:9px;margin-top:3px}.admin-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.admin-actions button{font-size:9px;padding:7px 9px;border-radius:6px;border:1px solid #303c46;background:#151d24;color:#fff}.admin-actions button.primary-admin{background:#f3f4f5;color:#080a0c}.admin-actions button.danger-admin{color:#ff8a8e;border-color:#5a2529;background:#251114}.admin-stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}.admin-stat div{border:1px solid #202b34;border-radius:8px;padding:10px;background:#080d12}.admin-stat b{font-size:17px;display:block}.admin-stat span{font-size:8px;color:#77838b}\n'''
          if '.admin-only{display:none}' not in s:
              s=s.replace('@media(max-width:950px)',css+'@media(max-width:950px)')
          old='<button onclick="openSettings()">⚙ &nbsp; Ayarlar</button>'
          new=old+'<button id="adminNav" class="admin-only" onclick="openAdmin()">◆ &nbsp; Admin</button>'
          if 'id="adminNav"' not in s and old in s: s=s.replace(old,new,1)
          modal='''\n<div id="adminModal" class="modal"><div class="box" style="width:min(1000px,100%);"><button class="close" onclick="closeAdmin()">×</button><h2>Admin / Moderasyon</h2><div id="adminDenied" style="display:none;color:#ff8a8e;font-size:11px">Bu alan için admin yetkisi gerekiyor.</div><div id="adminPanel" class="admin-grid"><div class="admin-tabs"><button class="active" onclick="adminTab('overview',this)">Genel Bakış</button><button onclick="adminTab('users',this)">Kullanıcılar</button><button onclick="adminTab('artists',this)">Sanatçı Doğrulama</button><button onclick="adminTab('posts',this)">Gönderiler</button><button onclick="adminTab('comments',this)">Yorumlar</button><button onclick="adminTab('featured',this)">Featured</button><button onclick="adminTab('firebase',this)">Firebase</button></div><div><div id="adminContent"></div></div></div></div></div>\n'''
          if 'id="adminModal"' not in s: s=s.replace('</body>',modal+'</body>')
          js='''\nlet isAdmin=false,adminTabName='overview';\nasync function checkAdmin(){if(!user||!db){isAdmin=false;return}try{const snap=await db.collection('users').doc(user.uid).get();isAdmin=!!(snap.exists&&(snap.data().role==='admin'||snap.data().admin===true));const nav=document.getElementById('adminNav');if(nav)nav.style.display=isAdmin?'block':'none'}catch(e){isAdmin=false}}\nfunction openAdmin(){document.getElementById('adminModal').classList.add('show');document.body.style.overflow='hidden';renderAdmin('overview')}\nfunction closeAdmin(){document.getElementById('adminModal').classList.remove('show');document.body.style.overflow=''}\nfunction adminTab(name,btn){adminTabName=name;document.querySelectorAll('.admin-tabs button').forEach(x=>x.classList.remove('active'));btn.classList.add('active');renderAdmin(name)}\nasync function renderAdmin(name){const box=document.getElementById('adminContent');if(!isAdmin){box.innerHTML='';document.getElementById('adminDenied').style.display='block';document.getElementById('adminPanel').style.display='none';return}document.getElementById('adminDenied').style.display='none';document.getElementById('adminPanel').style.display='grid';box.innerHTML='<div style="color:#77838b;font-size:10px">Yükleniyor...</div>';try{if(name==='overview'){const [u,t]=await Promise.all([db.collection('users').get(),db.collection('tattoos').get()]);box.innerHTML='<div class="admin-stat"><div><b>'+u.size+'</b><span>Kullanıcı</span></div><div><b>'+t.size+'</b><span>Gönderi</span></div><div><b>'+t.docs.filter(x=>x.data().featured).length+'</b><span>Featured</span></div></div><div class="admin-item"><b>Moderasyon merkezi hazır</b><small>Kullanıcı, sanatçı, gönderi ve featured yönetimi sol menüden yapılabilir.</small></div>'}else if(name==='users'||name==='artists'){const q=await db.collection('users').limit(100).get();let rows=q.docs.filter(d=>name==='users'||d.data().artistRequested||d.data().artistVerified);box.innerHTML='<div class="admin-list">'+rows.map(d=>{const x=d.data();return '<div class="admin-item"><b>'+safe(x.name||x.displayName||'Kullanıcı')+'</b><small>'+safe(x.email||d.id)+' · '+(x.artistVerified?'✓ Doğrulanmış sanatçı':x.artistRequested?'Sanatçı doğrulaması bekliyor':'Kullanıcı')+'</small><div class="admin-actions">'+(name==='artists'?'<button class="primary-admin" onclick="setArtist(\\''+d.id+'\\',true)">Doğrula</button><button class="danger-admin" onclick="setArtist(\\''+d.id+'\\',false)">Kaldır</button>':'')+'<button onclick="setRole(\\''+d.id+'\\',\\'user\\')">Kullanıcı yap</button></div></div>'}).join('')||'<div class="admin-item">Kayıt bulunamadı.</div></div>'}else if(name==='posts'||name==='featured'){const q=await db.collection('tattoos').orderBy('createdAt','desc').limit(100).get().catch(()=>db.collection('tattoos').limit(100).get());const rows=q.docs.filter(d=>name==='posts'||d.data().featured);box.innerHTML='<div class="admin-list">'+rows.map(d=>{const x=d.data();return '<div class="admin-item"><b>'+safe(x.title||'Başlıksız gönderi')+'</b><small>'+safe(x.category||'')+' · '+safe(x.ownerName||'')+'</small><div class="admin-actions"><button class="primary-admin" onclick="toggleFeatured(\\''+d.id+'\\')">'+(x.featured?'Featured kaldır':'Featured yap')+'</button><button class="danger-admin" onclick="deletePost(\\''+d.id+'\\')">Sil</button></div></div>'}).join('')||'<div class="admin-item">Gönderi bulunamadı.</div></div>'}else if(name==='comments'){const q=await db.collectionGroup('comments').limit(100).get();box.innerHTML='<div class="admin-list">'+q.docs.map(d=>{const x=d.data();return '<div class="admin-item"><b>'+safe(x.name||'User')+'</b><small>'+safe(x.text||'')+'</small><div class="admin-actions"><button class="danger-admin" onclick="deleteComment(\\''+d.ref.path+'\\')">Yorumu sil</button></div></div>'}).join('')||'<div class="admin-item">Yorum bulunamadı.</div></div>'}else{box.innerHTML='<div class="admin-item"><b>Firebase durumu</b><small>Auth: '+(auth?'bağlı':'bağlı değil')+' · Firestore: '+(db?'bağlı':'bağlı değil')+'</small></div>'}}catch(e){box.innerHTML='<div class="admin-item" style="color:#ff8a8e">'+safe(e.message)+'</div>'}}\nasync function setArtist(id,value){await db.collection('users').doc(id).set({artistVerified:value,artistRequested:false,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});renderAdmin(adminTabName)}\nasync function setRole(id,role){await db.collection('users').doc(id).set({role},{merge:true});renderAdmin(adminTabName)}\nasync function toggleFeatured(id){const ref=db.collection('tattoos').doc(id),s=await ref.get();if(s.exists)await ref.set({featured:!s.data().featured},{merge:true});renderAdmin(adminTabName)}\nasync function deletePost(id){if(!confirm('Bu gönderi silinsin mi?'))return;await db.collection('tattoos').doc(id).delete();renderAdmin(adminTabName);render()}\nasync function deleteComment(path){if(!confirm('Bu yorum silinsin mi?'))return;await db.doc(path).delete();renderAdmin(adminTabName)}\n'''
          if 'let isAdmin=false' not in s: s=s.replace('function render(){',js+'function render(){')
          s=s.replace('auth.onAuthStateChanged(u=>{user=u;if(u){document.getElementById("topAvatar").src=u.photoURL||document.getElementById("topAvatar").src}})', 'auth.onAuthStateChanged(u=>{user=u;if(u){document.getElementById("topAvatar").src=u.photoURL||document.getElementById("topAvatar").src;checkAdmin()}else{isAdmin=false;const nav=document.getElementById("adminNav");if(nav)nav.style.display="none"}})')
          p.write_text(s)
          Path('admin-upgrade.trigger').unlink(missing_ok=True)
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html admin-upgrade.trigger
          git diff --cached --quiet && exit 0
          git commit -m 'Add admin moderation panel'
          git push
